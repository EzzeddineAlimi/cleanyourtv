name: Build Weather and News APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-addon:
    name: Build ${{ matrix.addon }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        addon:
          - weather
          - news-screensaver
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Test and build APK
        working-directory: addons/${{ matrix.addon }}
        run: sh ./gradlew --no-daemon --console=plain testReleaseUnitTest assembleRelease
      - name: Make APK downloadable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.addon }}-apk
          path: addons/${{ matrix.addon }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
