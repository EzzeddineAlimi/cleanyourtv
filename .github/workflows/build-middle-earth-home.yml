name: Build Middle-earth TV Home

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Prepare bundled original wallpaper and theme
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          mkdir -p launcher/app/src/main/assets
          python3 tools/make_middle_earth_wallpaper.py launcher/app/src/main/assets/middle_earth_wallpaper.jpg
          cp themes/middle-earth/config.json launcher/app/src/main/assets/middle_earth_config.json
          sed -i 's|<string name="app_name">Home</string>|<string name="app_name">Middle-earth Home</string>|' launcher/app/src/main/res/values/strings.xml

      - name: Run tests and build separate launcher APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain -PlauncherApplicationId=com.ezzeddine.middleearth testReleaseUnitTest assembleRelease

      - name: Make standalone test APK downloadable
        uses: actions/upload-artifact@v4
        with:
          name: middle-earth-home-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error
